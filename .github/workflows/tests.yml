name: Cross-platform verification
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
permissions:
  contents: read
jobs:
  unittest:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.11', '3.12', '3.13', '3.14']
    runs-on: ${{ matrix.os }}
    env:
      PYTHONPATH: src
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Enable unprivileged symlinks on Windows runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\AppModelUnlock' -Name AllowDevelopmentWithoutDevLicense -Value 1 -PropertyType DWord -Force | Out-Null
      - name: Verify Windows runner symlink capability
        if: runner.os == 'Windows'
        run: python -c "import tempfile,pathlib; t=tempfile.TemporaryDirectory(); p=pathlib.Path(t.name); (p/'target').write_text('probe'); (p/'link').symlink_to(p/'target'); t.cleanup()"
      - run: python -m unittest discover -s tests -v
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/checkout@v4
        with:
          repository: openai/skills
          path: .ci/openai-skills
          sparse-checkout: skills/.system/skill-creator
          persist-credentials: false
      - run: python -m pip install 'PyYAML>=6,<7'
      - run: python .ci/openai-skills/skills/.system/skill-creator/scripts/quick_validate.py skill/codex-copilot
